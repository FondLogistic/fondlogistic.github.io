<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FOND LOGISTIC</title>

<style>
body {
margin:0;
font-family:Arial;
background:linear-gradient(#1a0025,#000);
color:white;
text-align:center;
}

h1 {color:#c084fc;}

.card {
background:rgba(255,255,255,0.05);
margin:15px;
padding:20px;
border-radius:20px;
}

select,input {
width:80%;
padding:10px;
margin-top:10px;
border-radius:10px;
border:none;
}

button {
padding:12px;
margin-top:10px;
border:none;
border-radius:10px;
}

.fixed {
position:fixed;
bottom:10px;
left:0;
right:0;
display:flex;
gap:10px;
padding:10px;
}

.fixed a {
flex:1;
padding:14px;
border-radius:10px;
text-decoration:none;
color:white;
}

.whatsapp{background:#25D366;}
.telegram{background:#0088cc;}
</style>
</head>

<body>

<h1>FOND LOGISTIC</h1>
<p>Отгрузка на склады WB</p>

<div class="card">
<h3>Калькулятор</h3>

<select id="city" onchange="updateOptions()">
<option value="">Выберите склад</option>
<option value="electro">Электросталь</option>
<option value="koledino">Коледино</option>
<option value="krasnodar">Краснодар</option>
</select>

<select id="type"></select>

<input id="qty" type="number" placeholder="Количество">

<button onclick="calc()">Рассчитать</button>
<p id="result"></p>

<button onclick="send()">Отправить заявку</button>
</div>

<div class="card">
<h3>Игра</h3>
<canvas id="game" width="300" height="400"></canvas>
<p id="score">Очки: 0</p>
<p id="reward"></p>
</div>

<div class="fixed">
<a href="#" onclick="send()" class="whatsapp">WhatsApp</a>
<a href="https://t.me/Fomin_No" class="telegram">Telegram</a>
</div>

<script>
const prices={
electro:[{name:"Короб 150",price:150},{name:"Паллет 1700",price:1700}],
koledino:[{name:"Паллет 1700",price:1700}],
krasnodar:[{name:"Короб 150",price:150},{name:"Паллет 5700",price:5700}]
};

function updateOptions(){
let city=document.getElementById("city").value;
let type=document.getElementById("type");

type.innerHTML="";

if(!prices[city]) return;

prices[city].forEach(o=>{
let opt=document.createElement("option");
opt.text=o.name;
opt.value=o.price;
type.add(opt);
});
}

function calc(){
let price=document.getElementById("type").value;
let qty=document.getElementById("qty").value || 0;
let total=price*qty;
document.getElementById("result").innerHTML="Итого: "+total+" ₽";
}

function send(){
window.location.href="https://wa.me/79772613079";
}

// GAME
let canvas=document.getElementById("game");
let ctx=canvas.getContext("2d");

let car={x:130,y:320};
let obs=[];
let score=0;

document.addEventListener("keydown",e=>{
if(e.key==="ArrowLeft") car.x-=20;
if(e.key==="ArrowRight") car.x+=20;
});

function loop(){
ctx.clearRect(0,0,300,400);

ctx.fillStyle="lime";
ctx.fillRect(car.x,car.y,40,40);

if(Math.random()<0.03){
obs.push({x:Math.random()*260,y:0});
}

ctx.fillStyle="red";
for(let i=0;i<obs.length;i++){
let o=obs[i];
o.y+=5;
ctx.fillRect(o.x,o.y,30,30);

if(o.y>400){
score++;
document.getElementById("score").innerText="Очки: "+score;
obs.splice(i,1);
}
}

requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
