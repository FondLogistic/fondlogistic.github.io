<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FOND LOGISTIC</title>

<style>
body {
margin:0;
font-family:Arial;
background:linear-gradient(#1a0025,#000);
color:white;
text-align:center;
}

h1 {color:#c084fc;}

.card {
background:rgba(255,255,255,0.05);
margin:15px;
padding:20px;
border-radius:20px;
}

select,input {
width:85%;
padding:14px;
margin-top:12px;
border-radius:14px;
border:none;
font-size:16px;
}

button {
padding:16px;
margin-top:15px;
border:none;
border-radius:14px;
font-size:18px;
width:85%;
background:linear-gradient(90deg,#a855f7,#7c3aed);
color:white;
}

.fixed {
position:fixed;
bottom:10px;
left:0;
right:0;
display:flex;
gap:10px;
padding:10px;
}

.fixed a {
flex:1;
padding:18px;
border-radius:16px;
text-decoration:none;
color:white;
font-size:18px;
text-align:center;
}

.whatsapp{background:#25D366;}
.telegram{background:#0088cc;}
</style>
</head>

<body>

<h1>FOND LOGISTIC</h1>
<p>Отгрузка на склады WB</p>
<p>🔥 Осталось 3 слота на сегодня</p>

<div class="card">
<h3>💰 Рассчитать стоимость</h3>

<select id="city"></select>
<select id="type"></select>

<input id="qty" type="number" placeholder="Количество">

<button onclick="calc()">Рассчитать</button>
<p id="result"></p>

<button onclick="send()">Отправить заявку</button>
</div>

<div class="fixed">
<a href="#" onclick="sendWhats()" class="whatsapp">WhatsApp</a>
<a href="https://t.me/Fomin_No" class="telegram">Telegram</a>
</div>

<script>

// ДАННЫЕ
const prices = {
"Электросталь / Обухово":[
{name:"Короб 150 ₽",price:150},
{name:"Паллет 1700 ₽",price:1700}
],
"Коледино":[
{name:"Паллет 1700 ₽",price:1700}
],
"СПБ":[
{name:"Паллет 4000 ₽",price:4000},
{name:"Короб 150 ₽",price:150}
],
"Тула / Алексин":[
{name:"Паллет 2400 ₽",price:2400},
{name:"Короб 150 ₽",price:150}
],
"Казань":[
{name:"Паллет 5000 ₽",price:5000},
{name:"Короб 150 ₽",price:150}
],
"Краснодар / Невинномысск":[
{name:"Паллет 5700 ₽",price:5700},
{name:"Короб 150 ₽",price:150}
],
"Рязань / Владимир":[
{name:"Паллет 3200 ₽",price:3200}
]
};

// ЗАПУСК
window.onload = function(){
let citySelect=document.getElementById("city");

Object.keys(prices).forEach(city=>{
let opt=document.createElement("option");
opt.text=city;
opt.value=city;
citySelect.add(opt);
});

updateOptions();
}

// ОБНОВЛЕНИЕ ТИПОВ
function updateOptions(){
let city=document.getElementById("city").value;
let typeSelect=document.getElementById("type");

typeSelect.innerHTML="";

prices[city].forEach(o=>{
let opt=document.createElement("option");
opt.text=o.name;
opt.value=o.price;
typeSelect.add(opt);
});
}

// ИЗМЕНЕНИЕ ГОРОДА
document.getElementById("city").onchange = updateOptions;

// РАСЧЕТ
function calc(){
let price=document.getElementById("type").value;
let qty=document.getElementById("qty").value || 0;
let total=price*qty;
document.getElementById("result").innerHTML="Итого: "+total+" ₽";
}

// ОТПРАВКА
function send(){
let city=document.getElementById("city").value;
let qty=document.getElementById("qty").value;

let text=`Здравствуйте, интересует отгрузка!
Склад: ${city}
Кол-во: ${qty}`;

window.open("https://wa.me/79772613079?text="+encodeURIComponent(text));
}

// КНОПКА
function sendWhats(){
send();
}

</script>

</body>
</html>
