<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FOND LOGISTIC</title>

<style>
body {
margin:0;
font-family:Arial;
background:linear-gradient(#1a0025,#000);
color:white;
text-align:center;
}

h1 {
font-size:42px;
color:#c084fc;
}

.card {
background:rgba(255,255,255,0.05);
margin:15px;
padding:20px;
border-radius:20px;
}

input, select {
width:80%;
padding:10px;
margin-top:10px;
border-radius:10px;
border:none;
}

button {
padding:12px;
border:none;
border-radius:10px;
margin-top:10px;
font-size:16px;
}

.whatsapp {background:#25D366;}
.telegram {background:#0088cc;}

.fixed {
position:fixed;
bottom:10px;
left:0;
right:0;
display:flex;
gap:10px;
padding:10px;
}

.fixed a {
flex:1;
text-decoration:none;
color:white;
padding:14px;
border-radius:12px;
}
</style>
</head>

<body>

<h1>FOND LOGISTIC</h1>
<p>Отгрузка на склады Wildberries</p>
<p>🔥 Осталось 3 слота на сегодня</p>

<div class="card">
<h3>💰 Рассчитать стоимость</h3>

<select id="city">
<option value="Электросталь">Электросталь</option>
<option value="Коледино">Коледино</option>
<option value="СПБ">СПБ</option>
<option value="Казань">Казань</option>
<option value="Краснодар">Краснодар</option>
</select>

<select id="type">
<option value="150">Короб (150₽)</option>
<option value="1700">Паллет (1700₽)</option>
</select>

<input type="number" id="qty" placeholder="Количество">

<button onclick="calc()">Рассчитать</button>

<p id="result"></p>

<button onclick="send()">Отправить заявку</button>

</div>

<div class="card">
<h3>🔥 Почему выбирают нас</h3>
<p>✔ Более 1000+ отгрузок</p>
<p>✔ Без срывов</p>
<p>✔ Быстрая запись</p>
</div>

<div class="fixed">
<a href="#" onclick="send()" class="whatsapp">WhatsApp</a>
<a href="https://t.me/Fomin_No" class="telegram">Telegram</a>
</div>

<script>
function calc(){
let price=document.getElementById("type").value;
let qty=document.getElementById("qty").value;
let total=price*qty;
document.getElementById("result").innerHTML="Итого: "+total+" ₽";
}

function send(){
let city=document.getElementById("city").value;
let qty=document.getElementById("qty").value;

let text="Здравствуйте, интересует отгрузка!%0AСклад: "+city+"%0AКол-во: "+qty;

window.location.href="https://wa.me/79772613079?text="+text;
}
</script>

</body>
</html>
